services:
  - type: web
    name: ajocircle-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_FEE_BASIS_POINTS
        value: "100"
      - key: APP_ORIGIN
        sync: false
      - key: PORT
        value: "5000"
    healthCheckPath: /api/health
    autoDeploy: true
