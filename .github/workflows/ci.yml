name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm install

      - name: Install workspace deps
        run: npm run install:all

      - name: Backend tests
        run: npm run test --prefix backend

      - name: Backend build
        run: npm run build --prefix backend

      - name: Admin build
        run: npm run build --prefix apps/admin

      - name: Mobile TypeScript check
        run: npx tsc --noEmit --project apps/mobile/tsconfig.json

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm install

      - name: Install mobile deps
        run: npm install --prefix apps/mobile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Expo web
        run: |
          cd apps/mobile
          nohup npx expo start --web --port 8081 > ../../expo.log 2>&1 &

      - name: Wait for Expo web
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8081 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Expo web did not start in time"
          cat expo.log || true
          exit 1

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
