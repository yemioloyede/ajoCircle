name: Auto Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/admin/**'
      - 'backend/**'
      - '.github/workflows/auto-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-admin:
    name: Deploy Admin (Vercel)
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  notify-missing-secrets:
    name: Missing Hook Secrets
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL == '' || secrets.RENDER_DEPLOY_HOOK_URL == '' }}
    steps:
      - name: Print setup reminder
        run: |
          echo "One or more deploy hook secrets are missing."
          echo "Set VERCEL_DEPLOY_HOOK_URL and RENDER_DEPLOY_HOOK_URL in repository secrets."